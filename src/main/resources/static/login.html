<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickPrint — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body class="receive-page">

  <a class="rp-wordmark" href="index.html">QuickPrint</a>
  <nav class="rp-nav">
    <button type="button" class="rp-theme-toggle" data-theme-toggle></button>
    <a class="rp-register" href="signup.html">Register</a>
  </nav>

  <main class="rp-hero">
    <h1 class="rp-title">Bem-vindo de <span class="rp-accent">volta</span></h1>
    <p class="rp-lead">Entra na tua conta para partilhar ficheiros.</p>

    <form id="login-form" class="rp-card" novalidate>
      <div class="rp-fields">
        <label class="rp-field">
          <span class="rp-field-label">Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="rp-field">
          <span class="rp-field-label">Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
      </div>

      <p id="login-error" class="rp-error" hidden></p>

      <button class="rp-btn" type="submit">Entrar</button>
    </form>

    <p class="rp-alt">Ainda não tens conta? <a href="signup.html">Criar conta</a></p>
  </main>

  <script src="js/csrf.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

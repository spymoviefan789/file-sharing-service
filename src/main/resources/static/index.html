<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickPrint — Receber ficheiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body class="receive-page">

  <span class="rp-wordmark">QuickPrint</span>
  <nav class="rp-nav">
    <button type="button" class="rp-theme-toggle" data-theme-toggle></button>
    <a href="login.html">Log in</a>
    <a class="rp-register" href="signup.html">Register</a>
  </nav>

  <main class="rp-hero">
    <h1 class="rp-title">Recebe o teu <span class="rp-accent">ficheiro</span></h1>
    <p class="rp-lead">Nome e código. Sem conta, sem instalar nada.</p>

    <form id="receive-form" class="rp-card" novalidate>
      <div class="rp-fields">
        <label class="rp-field rp-field--name">
          <span class="rp-field-label">Nome do ficheiro</span>
          <input id="nickname" type="text" autocomplete="off" spellcheck="false"
                 placeholder="ex: relatorio" required>
        </label>

        <label class="rp-field rp-field--code">
          <span class="rp-field-label">Código</span>
          <input id="code" type="text" autocomplete="off" spellcheck="false"
                 maxlength="6" class="rp-code" placeholder="A1B2C3" required>
        </label>
      </div>

      <p id="receive-error" class="rp-error" hidden></p>

      <button id="download-btn" class="rp-btn" type="submit">Descarregar</button>
      <button id="preview-btn" class="rp-ghost" type="button">Pré-visualizar primeiro</button>
    </form>
  </main>

  <script src="js/receive.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickPrint — Criar conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body class="receive-page">

  <a class="rp-wordmark" href="index.html">QuickPrint</a>
  <nav class="rp-nav">
    <button type="button" class="rp-theme-toggle" data-theme-toggle></button>
    <a href="login.html">Log in</a>
  </nav>

  <main class="rp-hero">
    <h1 class="rp-title">Cria a tua <span class="rp-accent">conta</span></h1>
    <p class="rp-lead">Só quem envia precisa de conta. Receber é sempre livre.</p>

    <form id="signup-form" class="rp-card" novalidate>
      <div class="rp-fields">
        <label class="rp-field">
          <span class="rp-field-label">Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="rp-field">
          <span class="rp-field-label">Password (mín. 8 caracteres)</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
        </label>
      </div>

      <p id="signup-error" class="rp-error" hidden></p>

      <button class="rp-btn" type="submit">Criar conta</button>
    </form>

    <p class="rp-alt">Já tens conta? <a href="login.html">Entrar</a></p>
  </main>

  <script src="js/csrf.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>

spring.application.name=QuickPrint

# --- Database ---
# Create the database once in psql/pgAdmin with:  CREATE DATABASE quickprint;
# Values can be overridden by environment variables (DB_USER, DB_PASSWORD)
# so real credentials never need to be committed.
spring.datasource.url=jdbc:postgresql://localhost:5432/quickprint
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
# 'update' lets Hibernate create/alter tables from our @Entity classes.
# Convenient while learning; real projects use versioned migrations (Flyway) - we can add that later.
spring.jpa.hibernate.ddl-auto=update
# Disable a legacy behavior that keeps DB connections open during view rendering.
spring.jpa.open-in-view=false

# --- File uploads ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- QuickPrint storage ---
# Where uploaded bytes live on disk. Deliberately OUTSIDE the web root and
# static resources, so files are only ever reachable through our controllers
# (which check the access code first). Overridable via STORAGE_DIR.
quickprint.storage.dir=${STORAGE_DIR:./storage}
# Default lifetime of an uploaded file before the cleanup job removes it.
quickprint.storage.default-ttl=P7D
# Guest (anonymous) uploads live much shorter than account uploads.
quickprint.storage.guest-ttl=PT24H
# Max active files per free account.
quickprint.limits.free-max-files=20
# How often the cleanup job scans for and deletes expired files.
quickprint.cleanup.interval=PT1H
